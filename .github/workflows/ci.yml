name: CI Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: wedding_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # FIXME: Standardize this when CD is set up & hide all the impt env vars in GitHub Secrets
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: wedding_management
      DATABASE_URL: postgresql://admin:password123@localhost:5432/wedding_management
      FRONTEND_URL: http://localhost:3000
      SENDGRID_API_KEY: API_KEY_NOT_ACTUALLY_HERE
      PORT: ${{ secrets.PORT }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_REFRESH_KEY: ${{ secrets.JWT_REFRESH_KEY }}
      FASTAPI_URL: http://localhost:8001
      STRIPE_SECRET_KEY: API_KEY_NOT_ACTUALLY_HERE
      STRIPE_WEBHOOK_SECRET: API_KEY_NOT_ACTUALLY_HERE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push

      - name: Run linter
        run: npm run lint:check

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
